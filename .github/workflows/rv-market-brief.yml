name: Update RV market brief

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/Stockholm'
    - cron: '17 7 * * *'
      timezone: 'Europe/Stockholm'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rv-market-brief.yml'
      - 'scripts/update-rv-market-brief.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: rv-market-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Collect European and Chinese RV updates
        env:
          BACKUP_SCAN: ${{ github.event.schedule == '17 7 * * *' }}
        run: python3 scripts/update-rv-market-brief.py
      - name: Publish the public feed
        id: commit
        run: |
          git diff --quiet -- apps/market-intelligence/brief.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/market-intelligence/brief.json
          git commit -m "Refresh Europe and China RV market brief"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Could not publish market data after five attempts.' >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
      - name: Publish refreshed GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GH_API/repos/$GH_REPOSITORY/pages/builds"
