<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Caravan Crunch — Snake</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#07111f;--panel:#0d1d30;--panel2:#122740;--ink:#f4f8ff;--muted:#9fb2c9;
    --line:#29425e;--blue:#35a7ff;--blue2:#0866c6;--yellow:#ffd447;--red:#ff5263;
    --green:#42e58a;--shadow:0 18px 55px rgba(0,0,0,.38)
  }
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#dfeaf5;--panel:#f8fbff;--panel2:#eaf3fb;--ink:#07192d;--muted:#567088;
    --line:#b9cee1;--shadow:0 18px 45px rgba(19,54,88,.18)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;overscroll-behavior:none}
  body{font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;background:
    radial-gradient(circle at 50% -20%,rgba(53,167,255,.28),transparent 38%),var(--bg);color:var(--ink)}
  button{font:inherit;color:inherit}
  .app{width:min(100%,760px);min-height:100svh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  header{display:flex;align-items:center;gap:10px}
  .brand{min-width:0;display:flex;align-items:center;gap:10px;margin-right:auto}
  .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--blue),var(--blue2));display:grid;place-items:center;box-shadow:0 8px 24px rgba(17,132,230,.35);font-size:23px}
  h1{font-size:clamp(20px,5vw,28px);line-height:1;margin:0;letter-spacing:-.04em}
  .subtitle{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
  .tools{display:flex;gap:6px}
  .icon-btn{height:40px;min-width:40px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;font-weight:900}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .stat{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:14px;padding:8px 9px;min-width:0}
  .stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;white-space:nowrap}
  .stat b{display:block;font-size:clamp(17px,4.4vw,24px);line-height:1.1;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
  .game-shell{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:8px;box-shadow:var(--shadow);overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:1;background:#092037;border-radius:14px;touch-action:none}
  .scanlines{pointer-events:none;position:absolute;inset:8px;border-radius:14px;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);mix-blend-mode:overlay}
  .message{pointer-events:none;position:absolute;left:50%;top:23%;transform:translate(-50%,-50%) scale(.7) rotate(-4deg);opacity:0;padding:9px 15px;border-radius:14px;background:var(--yellow);color:#171100;font-size:clamp(18px,6vw,36px);font-weight:1000;letter-spacing:-.04em;box-shadow:0 9px 0 rgba(0,0,0,.22);white-space:nowrap}
  .message.show{animation:pop .8s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-9deg)}20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(1.12) rotate(2deg)}}
  .overlay{position:absolute;inset:8px;display:grid;place-items:center;padding:24px;border-radius:14px;background:rgba(2,11,22,.72);backdrop-filter:blur(5px);text-align:center;transition:.18s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay-card{width:min(100%,390px)}
  .mascot{font-size:64px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));animation:float 2s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-7px) rotate(3deg)}}
  .overlay h2{font-size:clamp(28px,8vw,48px);line-height:.95;margin:9px 0 10px;letter-spacing:-.06em}
  .overlay p{color:#d8e8f8;margin:0 auto 17px;max-width:330px;line-height:1.35;font-weight:650}
  .primary{width:100%;min-height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#46b5ff,#0875d7);box-shadow:0 6px 0 #064a8c;color:white;font-weight:1000;font-size:18px;cursor:pointer}
  .primary:active{transform:translateY(4px);box-shadow:0 2px 0 #064a8c}
  .statusbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .belly{height:16px;border:1px solid var(--line);background:var(--panel);border-radius:999px;overflow:hidden;position:relative}
  .belly-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .25s ease}
  .belly-label{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:1000;color:#06101d;text-shadow:0 1px rgba(255,255,255,.5);letter-spacing:.08em}
  .hint{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
  .controls{display:grid;grid-template-columns:1fr 1.12fr 1fr;grid-template-areas:". up ." "left down right";gap:7px;width:min(100%,360px);margin:0 auto}
  .control{min-height:55px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:25px;font-weight:1000;cursor:pointer;touch-action:manipulation}
  .control:active,.control.active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);background:var(--blue2)}
  [data-dir="up"]{grid-area:up}[data-dir="left"]{grid-area:left}[data-dir="down"]{grid-area:down}[data-dir="right"]{grid-area:right}
  .actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
  .action{min-height:46px;border:1px solid var(--line);border-radius:13px;background:var(--panel);cursor:pointer;font-weight:900}
  .action.pause{background:var(--yellow);color:#201900;border-color:#c99c00}
  footer{text-align:center;color:var(--muted);font-size:10px;font-weight:700;padding:2px}
  .shake{animation:shake .38s linear}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,-1px)}80%{transform:translate(4px,2px)}}
  @media(min-width:700px) and (min-height:760px){.app{padding-top:18px}.controls{width:320px}.control{min-height:50px}}
  @media(max-height:720px) and (orientation:landscape){.app{width:min(100%,1000px);display:grid;grid-template-columns:minmax(320px,1fr) 270px;grid-template-rows:auto auto 1fr auto;align-items:start}.app header{grid-column:1/-1}.stats{grid-column:2;grid-row:2}.game-shell{grid-column:1;grid-row:2/5}.statusbar{grid-column:2;grid-row:3}.controls{grid-column:2;grid-row:4}.actions{grid-column:2;grid-row:5}footer{display:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand">
      <div class="mark">🐍</div>
      <div><h1>Caravan Crunch</h1><div class="subtitle" id="subtitle">The hungriest snake in Tidaholm</div></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">☾</button>
    </div>
  </header>

  <section class="stats" aria-label="Game statistics">
    <div class="stat"><span id="scoreLabel">Caravans</span><b id="score">0</b></div>
    <div class="stat"><span id="weightLabel">Weight</span><b><span id="weight">38</span> kg</b></div>
    <div class="stat"><span id="levelLabel">Level</span><b id="level">1</b></div>
    <div class="stat"><span id="bestLabel">Best</span><b id="best">0</b></div>
  </section>

  <section class="game-shell" id="gameShell">
    <canvas id="game" width="720" height="720" aria-label="Snake game"></canvas>
    <div class="scanlines"></div>
    <div class="message" id="message">CRUNCH!</div>
    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <div class="mascot" id="mascot">🐍🚐</div>
        <h2 id="overlayTitle">MArtin is hungry.</h2>
        <p id="overlayText">Eat caravans. Get ridiculously fat. Try not to crash when the inevitable happens.</p>
        <button class="primary" id="startBtn">START CRUNCHING</button>
      </div>
    </div>
  </section>

  <div class="statusbar">
    <div class="belly"><div class="belly-fill" id="bellyFill"></div><div class="belly-label" id="bellyLabel">BELLY 0%</div></div>
    <div class="hint" id="hint">Swipe or use arrows</div>
  </div>

  <nav class="controls" aria-label="Direction controls">
    <button class="control" data-dir="up" aria-label="Up">▲</button>
    <button class="control" data-dir="left" aria-label="Left">◀</button>
    <button class="control" data-dir="down" aria-label="Down">▼</button>
    <button class="control" data-dir="right" aria-label="Right">▶</button>
  </nav>

  <div class="actions">
    <button class="action pause" id="pauseBtn">PAUSE</button>
    <button class="action" id="newBtn">NEW GAME</button>
  </div>
  <footer id="footer">Built for caravan people with questionable appetite.</footer>
</main>

<script>
(() => {
  'use strict';
  const $=s=>document.querySelector(s);
  const canvas=$('#game'),ctx=canvas.getContext('2d'),shell=$('#gameShell');
  const GRID=24,STORE='caravan-crunch-v1';
  const ui={overlay:$('#overlay'),title:$('#overlayTitle'),text:$('#overlayText'),start:$('#startBtn'),score:$('#score'),weight:$('#weight'),level:$('#level'),best:$('#best'),message:$('#message'),belly:$('#bellyFill'),bellyLabel:$('#bellyLabel'),pause:$('#pauseBtn')};
  const copy={
    en:{subtitle:'The hungriest snake in Tidaholm',score:'Caravans',weight:'Weight',level:'Level',best:'Best',pause:'PAUSE',resume:'RESUME',newGame:'NEW GAME',start:'START CRUNCHING',again:'CRUNCH AGAIN',readyTitle:'MArtin is hungry.',readyText:'Eat caravans. Get ridiculously fat. Try not to crash when the inevitable happens.',overTitle:'MArtin crashed!',overText:s=>`You swallowed ${s} caravans before the road fought back.`,belly:'BELLY',hint:'Swipe or use arrows',footer:'Built for caravan people with questionable appetite.',crunch:['CRUNCH!','MORE CARAVAN!','TASTES LIKE HOLIDAY!'],puke:['BLAAARGH!','TOO MUCH CARAVAN!','CARAVAN SICKNESS!'],paused:'Snack break',pausedText:'The caravans are temporarily safe.'},
    sv:{subtitle:'Den hungrigaste ormen i Tidaholm',score:'Husvagnar',weight:'Vikt',level:'Nivå',best:'Rekord',pause:'PAUS',resume:'FORTSÄTT',newGame:'NYTT SPEL',start:'BÖRJA ÄTA',again:'ÄT IGEN',readyTitle:'MArtin är hungrig.',readyText:'Ät husvagnar. Bli löjligt fet. Försök att inte krascha när det oundvikliga händer.',overTitle:'MArtin kraschade!',overText:s=>`Du svalde ${s} husvagnar innan vägen slog tillbaka.`,belly:'MAGE',hint:'Svep eller använd pilar',footer:'Byggt för husvagnsfolk med tveksam aptit.',crunch:['KRASCHMUMS!','MER HUSVAGN!','SMAKAR SEMESTER!'],puke:['BLÄÄÄRK!','FÖR MYCKET HUSVAGN!','HUSVAGNSSJUK!'],paused:'Matpaus',pausedText:'Husvagnarna är tillfälligt säkra.'}
  };

  let state=loadPrefs();
  let snake,dir,nextDir,caravan,vomit,particles,score,belly,weight,level,running,paused,over,last,accumulator,speed,raf,audio;

  function loadPrefs(){
    try{return Object.assign({lang:'en',theme:'dark',sound:true,best:0},JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return{lang:'en',theme:'dark',sound:true,best:0}}
  }
  function savePrefs(){localStorage.setItem(STORE,JSON.stringify(state))}
  function applyPrefs(){
    document.documentElement.dataset.theme=state.theme;
    document.documentElement.lang=state.lang;
    $('#langBtn').textContent=state.lang.toUpperCase();
    $('#themeBtn').textContent=state.theme==='dark'?'☀':'☾';
    $('#soundBtn').textContent=state.sound?'🔊':'🔇';
    const t=copy[state.lang];
    $('#subtitle').textContent=t.subtitle;$('#scoreLabel').textContent=t.score;$('#weightLabel').textContent=t.weight;$('#levelLabel').textContent=t.level;$('#bestLabel').textContent=t.best;
    $('#newBtn').textContent=t.newGame;$('#hint').textContent=t.hint;$('#footer').textContent=t.footer;
    ui.pause.textContent=paused?t.resume:t.pause;ui.best.textContent=state.best;
    updateBelly();
    if(!running&&!over){ui.title.textContent=t.readyTitle;ui.text.textContent=t.readyText;ui.start.textContent=t.start}
  }
  function resetGame(){
    snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12},{x:5,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};
    caravan=randomFreeCell();vomit=[];particles=[];score=0;belly=0;weight=38;level=1;speed=145;running=false;paused=false;over=false;last=0;accumulator=0;
    updateStats();applyPrefs();draw();showReady();
  }
  function showReady(){const t=copy[state.lang];ui.title.textContent=t.readyTitle;ui.text.textContent=t.readyText;ui.start.textContent=t.start;$('#mascot').textContent='🐍🚐';ui.overlay.classList.remove('hidden')}
  function start(){
    if(over) resetGame();
    running=true;paused=false;over=false;ui.overlay.classList.add('hidden');ui.pause.textContent=copy[state.lang].pause;
    last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);tone(260,.06,'square');
  }
  function togglePause(){
    if(!running&& !over){start();return}
    if(over)return;
    paused=!paused;
    ui.pause.textContent=paused?copy[state.lang].resume:copy[state.lang].pause;
    if(paused){const t=copy[state.lang];ui.title.textContent=t.paused;ui.text.textContent=t.pausedText;ui.start.textContent=t.resume;$('#mascot').textContent='🐍💤';ui.overlay.classList.remove('hidden')}
    else{ui.overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}
  }
  function gameOver(){
    running=false;over=true;cancelAnimationFrame(raf);state.best=Math.max(state.best,score);savePrefs();ui.best.textContent=state.best;
    const t=copy[state.lang];ui.title.textContent=t.overTitle;ui.text.textContent=t.overText(score);ui.start.textContent=t.again;$('#mascot').textContent='💥🐍';ui.overlay.classList.remove('hidden');
    shell.classList.remove('shake');void shell.offsetWidth;shell.classList.add('shake');tone(85,.32,'sawtooth');
  }
  function loop(ts){
    if(!running||paused)return;
    const dt=Math.min(80,ts-last);last=ts;accumulator+=dt;
    while(accumulator>=speed){step();accumulator-=speed;if(!running)break}
    draw();raf=requestAnimationFrame(loop);
  }
  function step(){
    dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some((p,i)=>i>1&&p.x===head.x&&p.y===head.y)){gameOver();return}
    snake.unshift(head);
    const ate=head.x===caravan.x&&head.y===caravan.y;
    if(ate){
      score++;belly++;weight+=Math.round(22+belly*4);level=1+Math.floor(score/5);speed=Math.max(64,145-(level-1)*10);
      burst(caravan.x,caravan.y,'#ffd447',16);showMessage(random(copy[state.lang].crunch));tone(440,.07,'square');setTimeout(()=>tone(660,.06,'square'),55);
      caravan=randomFreeCell();
      if(belly>=5)doVomit();
    }else snake.pop();
    vomit.forEach(v=>v.life--);vomit=vomit.filter(v=>v.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);
    updateStats();
  }
  function doVomit(){
    showMessage(random(copy[state.lang].puke));shell.classList.remove('shake');void shell.offsetWidth;shell.classList.add('shake');
    const tail=snake[snake.length-1];for(let i=0;i<4;i++)vomit.push({x:(tail.x-i+GRID)%GRID,y:tail.y,life:48+i*8,spin:Math.random()*6.2});
    snake.splice(Math.max(5,snake.length-3));belly=1;weight=Math.max(55,weight-92);burst(snake[0].x,snake[0].y,'#8cff72',24);tone(120,.18,'sawtooth');setTimeout(()=>tone(70,.22,'sawtooth'),120);
  }
  function setDirection(x,y){
    if(!running&&!over)start();
    if(paused||over)return;
    if(x===-dir.x&&y===-dir.y)return;
    nextDir={x,y};
  }
  function randomFreeCell(){
    let p,guard=0;do{p={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};guard++}while(snake&&snake.some(s=>s.x===p.x&&s.y===p.y)&&guard<1000);return p
  }
  function updateStats(){ui.score.textContent=score;ui.weight.textContent=weight;ui.level.textContent=level;ui.best.textContent=state.best;updateBelly()}
  function updateBelly(){const pct=Math.min(100,(belly||0)/5*100);ui.belly.style.width=pct+'%';ui.bellyLabel.textContent=`${copy[state.lang].belly} ${pct}%`}
  function showMessage(text){ui.message.textContent=text;ui.message.classList.remove('show');void ui.message.offsetWidth;ui.message.classList.add('show')}
  function random(a){return a[Math.floor(Math.random()*a.length)]}
  function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,color,life:16+Math.random()*18})}

  function draw(){
    const css=Math.max(280,canvas.clientWidth||720),dpr=Math.min(2,devicePixelRatio||1),size=Math.round(css*dpr);
    if(canvas.width!==size||canvas.height!==size){canvas.width=size;canvas.height=size}
    const cell=size/GRID,dark=state.theme==='dark';
    ctx.clearRect(0,0,size,size);
    const g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,dark?'#071a2d':'#d8edf8');g.addColorStop(1,dark?'#0b2d45':'#b9dceb');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
    ctx.strokeStyle=dark?'rgba(129,190,225,.06)':'rgba(7,75,115,.08)';ctx.lineWidth=1;
    for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(size,i*cell);ctx.stroke()}
    drawRoad(size,cell);drawCaravan(caravan.x,caravan.y,cell);
    vomit.forEach(v=>drawVomit(v,cell));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x*cell,p.y*cell,Math.max(2,cell*.08),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
    [...snake].reverse().forEach((p,rev)=>{const i=snake.length-1-rev;drawSnakePart(p,i,cell)});
  }
  function drawRoad(size,cell){ctx.save();ctx.globalAlpha=.16;ctx.fillStyle='#89a6b8';ctx.fillRect(0,size*.47,size,size*.12);ctx.strokeStyle='#fff';ctx.setLineDash([cell*.55,cell*.42]);ctx.lineWidth=Math.max(1,cell*.06);ctx.beginPath();ctx.moveTo(0,size*.53);ctx.lineTo(size,size*.53);ctx.stroke();ctx.restore()}
  function drawCaravan(x,y,c){
    const px=x*c,py=y*c;ctx.save();ctx.translate(px+c/2,py+c/2);const bob=Math.sin(performance.now()/170)*c*.035;ctx.translate(0,bob);
    ctx.fillStyle='rgba(0,0,0,.25)';roundRect(-c*.4,c*.3,c*.82,c*.14,c*.07);ctx.fill();
    ctx.fillStyle='#f8fbff';ctx.strokeStyle='#0c3153';ctx.lineWidth=c*.055;roundRect(-c*.43,-c*.33,c*.78,c*.62,c*.12);ctx.fill();ctx.stroke();
    ctx.fillStyle='#38a8eb';roundRect(-c*.25,-c*.2,c*.32,c*.21,c*.03);ctx.fill();ctx.fillStyle='#112f4b';ctx.fillRect(-c*.05,-c*.2,c*.025,c*.21);ctx.fillRect(-c*.25,-c*.105,c*.32,c*.025);
    ctx.fillStyle='#0875d7';ctx.fillRect(-c*.41,c*.04,c*.74,c*.09);ctx.fillStyle='#0b2741';ctx.beginPath();ctx.arc(-c*.2,c*.32,c*.105,0,Math.PI*2);ctx.arc(c*.18,c*.32,c*.105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=`900 ${c*.22}px system-ui`;ctx.textAlign='center';ctx.fillText('D',c*.2,c*.01);ctx.restore()
  }
  function drawSnakePart(p,i,c){
    const fat=Math.min(.19,belly*.028),r=c*(i===0?.43:.34+fat);const cx=(p.x+.5)*c,cy=(p.y+.5)*c;
    const grad=ctx.createRadialGradient(cx-r*.25,cy-r*.35,r*.1,cx,cy,r);grad.addColorStop(0,i===0?'#72d0ff':'#36aaff');grad.addColorStop(1,i===0?'#0874d3':'#064f9c');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=Math.max(1,c*.04);ctx.stroke();
    if(i===0){const side=c*.18;const ex=cx+(dir.y||1)*side,ey=cy+(dir.x||1)*side;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-dir.x*c*.14,ey-dir.y*c*.14,c*.105,0,Math.PI*2);ctx.arc(ex+dir.x*c*.14,ey+dir.y*c*.14,c*.105,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07111f';ctx.beginPath();ctx.arc(ex-dir.x*c*.14+dir.x*c*.04,ey-dir.y*c*.14+dir.y*c*.04,c*.045,0,Math.PI*2);ctx.arc(ex+dir.x*c*.14+dir.x*c*.04,ey+dir.y*c*.14+dir.y*c*.04,c*.045,0,Math.PI*2);ctx.fill()}
  }
  function drawVomit(v,c){ctx.save();ctx.translate((v.x+.5)*c,(v.y+.5)*c);ctx.rotate(v.spin+v.life*.08);ctx.globalAlpha=Math.min(1,v.life/12);ctx.fillStyle='#8cff72';roundRect(-c*.24,-c*.16,c*.48,c*.32,c*.09);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-c*.12,-c*.08,c*.22,c*.08);ctx.restore();ctx.globalAlpha=1}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
  function tone(freq,duration,type){
    if(!state.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),gain=audio.createGain();o.type=type||'sine';o.frequency.value=freq;gain.gain.setValueAtTime(.07,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(gain);gain.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}
  }

  const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
  addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();setDirection(...keys[e.key])}else if(e.code==='Space'){e.preventDefault();togglePause()}});
  document.querySelectorAll('[data-dir]').forEach(b=>{
    const go=()=>{const d=b.dataset.dir,v=d==='up'?[0,-1]:d==='down'?[0,1]:d==='left'?[-1,0]:[1,0];setDirection(...v);b.classList.add('active');setTimeout(()=>b.classList.remove('active'),100)};
    b.addEventListener('pointerdown',e=>{e.preventDefault();go()});
  });
  let sx=0,sy=0;
  canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;Math.abs(dx)>Math.abs(dy)?setDirection(Math.sign(dx),0):setDirection(0,Math.sign(dy))});
  ui.start.addEventListener('click',()=>paused?togglePause():start());ui.pause.addEventListener('click',togglePause);$('#newBtn').addEventListener('click',resetGame);
  $('#langBtn').addEventListener('click',()=>{state.lang=state.lang==='en'?'sv':'en';savePrefs();applyPrefs();draw()});
  $('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';savePrefs();applyPrefs();draw()});
  $('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;savePrefs();applyPrefs();tone(520,.08,'square')});
  addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});
  resetGame();
})();
</script>
